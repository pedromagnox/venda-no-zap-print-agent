name: store-msix

on:
  workflow_dispatch:
  push:
    branches:
      - feat/store

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: better-sqlite3 para o Electron
        shell: bash
        run: |
          EV=$(node -p "require('./node_modules/electron/package.json').version")
          cd node_modules/better-sqlite3
          npx --no-install prebuild-install --runtime=electron --target=$EV --arch=x64 --platform=win32
      - run: npm run dist:store
      - name: Manifesto
        shell: pwsh
        run: |
          $pkg = Get-ChildItem release -Recurse -Filter *.msix | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          $entry = $zip.Entries | Where-Object { $_.FullName -eq 'AppxManifest.xml' }
          $reader = New-Object System.IO.StreamReader($entry.Open())
          $reader.ReadToEnd()
          $reader.Close()
          $zip.Dispose()
      - uses: actions/upload-artifact@v4
        with:
          name: msix-store
          path: release/store-*/*.msix
          if-no-files-found: error
